[tool.poetry]
name = "srm-unichat-backend"
version = "0.1.0"
description = "FastAPI backend for SRM UniChat RAG"
authors = ["SRM UniChat <dev@srm.local>"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.111.0"
uvicorn = {extras=["standard"], version="^0.30.0"}
orjson = "^3.10.7"
python-dotenv = "^1.0.1"
sqlalchemy = "^2.0.30"
psycopg = {version = "^3.1.19", extras=["binary"]}
alembic = "^1.13.2"
pgvector = "^0.2.5"
openai = "^1.35.3"
httpx = "^0.27.0"
pydantic = "^2.7.1"
pydantic-settings = "^2.3.1"
tenacity = "^9.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.2"
pytest-asyncio = "^0.23.7"
black = "^24.4.2"
ruff = "^0.4.8"
mypy = "^1.10.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"


